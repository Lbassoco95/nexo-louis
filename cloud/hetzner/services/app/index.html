<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>{{AGENT_NAME}}</title>
<link rel="manifest" href="/app/manifest.webmanifest">
<link rel="icon" href="/app/icon.svg">
<link rel="apple-touch-icon" href="/app/icon.svg">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="{{AGENT_NAME}}">
<style>
:root{--bg:#0b1220;--panel:#121a2c;--panel2:#18233a;--line:#243049;--tx:#e8edf7;--mut:#8b97b3;--acc:#4f8cff;--acc2:#7c3aed;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--r:16px}
@media (prefers-color-scheme:light){:root{--bg:#f4f6fb;--panel:#fff;--panel2:#eef2fa;--line:#dde3f0;--tx:#111a2e;--mut:#5d6985}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;overscroll-behavior:none}
#app{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
header .dot{width:10px;height:10px;border-radius:50%;background:var(--mut)}
header .dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
header h1{font-size:18px;margin:0;flex:1;letter-spacing:.3px}
header button{background:none;border:0;color:var(--mut);font-size:20px;padding:4px 8px}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none;flex-direction:column}
.view.on{display:flex}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px}
nav{display:flex;border-top:1px solid var(--line);background:var(--panel);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:9px 0 7px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .i{font-size:21px;line-height:1}
nav button.on{color:var(--acc)}
nav .badge{position:absolute;margin:-2px 0 0 14px;background:var(--bad);color:#fff;border-radius:9px;font-size:10px;padding:0 5px;min-width:16px;text-align:center}
/* chat */
.msg{max-width:88%;margin:0 0 10px;padding:10px 13px;border-radius:var(--r);word-wrap:break-word;overflow-wrap:anywhere}
.msg.u{margin-left:auto;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-bottom-right-radius:4px;white-space:pre-wrap}
.msg.a{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg .meta{font-size:11px;color:var(--mut);margin-top:6px;display:flex;gap:12px}
.msg .meta button{background:none;border:0;color:var(--mut);padding:0;font-size:11px}
.msg p{margin:.35em 0}.msg p:first-child{margin-top:0}.msg p:last-child{margin-bottom:0}
.msg ul,.msg ol{margin:.35em 0;padding-left:1.25em}
.msg h3,.msg h4{margin:.6em 0 .25em;font-size:15px}
.msg code{background:var(--panel2);padding:1px 5px;border-radius:5px;font-size:13px}
.msg pre{background:var(--panel2);padding:10px;border-radius:10px;overflow-x:auto;font-size:12.5px}
.msg pre code{background:none;padding:0}
.msg table{border-collapse:collapse;font-size:13px;display:block;overflow-x:auto}
.msg th,.msg td{border:1px solid var(--line);padding:4px 8px;text-align:left}
.msg th{background:var(--panel2)}
.msg a{color:var(--acc)}
.msg.live.has::after{content:"▍";color:var(--acc);animation:p 1s infinite;margin-left:1px}
.msg .st{font-size:12px;color:var(--mut);margin-top:4px}
.rb.stop{background:var(--bad)}
header button{position:relative}
.bbadge{position:absolute;top:-2px;right:-2px;background:var(--bad);color:#fff;border-radius:9px;font-size:10px;line-height:16px;min-width:16px;padding:0 4px;text-align:center;font-weight:700}
.nitem{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.nitem.new{border-left:4px solid var(--acc)}
.nitem .nh{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.nitem .nh b{font-size:14.5px}.nitem .nh span{font-size:11px;color:var(--mut);white-space:nowrap}
.nitem .nb{margin-top:6px;font-size:13.5px;max-height:9.5em;overflow:hidden;position:relative}
.nitem .nb.open{max-height:none}
.nitem .nb.clip::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2.2em;background:linear-gradient(transparent,var(--panel))}
.nitem .nb.open::after{display:none}
.nitem .more{background:none;border:0;color:var(--acc);font-size:12.5px;padding:6px 0 0}
.nitem .acts{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.nitem .acts .btn{padding:10px 14px}
.nitem .okline{font-size:12.5px;color:var(--ok);background:var(--panel2);border-radius:10px;padding:8px 10px}
.nitem .errline{font-size:12.5px;color:var(--bad);margin-top:6px}
.typing{display:inline-flex;gap:4px;padding:4px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--mut);animation:b 1.1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.25;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--panel);border:1px solid var(--line);color:var(--tx);border-radius:999px;padding:7px 13px;font-size:13px}
.composer{display:flex;align-items:flex-end;gap:8px;padding:8px 12px 10px}
.composer textarea{flex:1;resize:none;max-height:140px;background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:22px;padding:10px 15px;font:inherit;outline:none}
.composer textarea:focus{border-color:var(--acc)}
.rb{width:44px;height:44px;border-radius:50%;border:0;color:#fff;font-size:19px;flex:none;background:linear-gradient(135deg,var(--acc),var(--acc2))}
.rb.mic{background:var(--panel);border:1px solid var(--line);color:var(--tx)}
.rb.mic.rec{background:var(--bad);color:#fff;animation:p 1s infinite}
@keyframes p{50%{opacity:.6}}
.rb:disabled{opacity:.4}
/* cards */
.sec{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.8px;margin:18px 2px 8px}
.sec:first-child{margin-top:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
.task{display:flex;gap:12px;align-items:flex-start}
.task .ck{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--mut);background:none;color:#fff;font-size:15px;padding:0;margin-top:1px}
.task.done{opacity:.45}.task.done .ck{background:var(--ok);border-color:var(--ok)}.task.done .tt{text-decoration:line-through}
.task .tt{flex:1;font-size:14.5px}
.task.hot{border-left:4px solid var(--bad)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:center}
.stat b{display:block;font-size:22px}.stat span{font-size:11px;color:var(--mut)}
.pill{display:inline-block;font-size:11px;border-radius:999px;padding:2px 9px;background:var(--panel2);color:var(--mut);margin-right:6px}
.pill.listo{background:#064e3b;color:#6ee7b7}.pill.en_vobo{background:#78350f;color:#fcd34d}.pill.brief{background:#1e3a8a;color:#93c5fd}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sub{font-size:12px;color:var(--mut);margin-top:3px}
.filters{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none}
.filters .chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
input.search{width:100%;background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font:inherit;margin-bottom:10px;outline:none}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;z-index:20}
.sheet.on{display:flex}
.sheet .in{background:var(--bg);width:100%;max-height:88dvh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.sheet .hd{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet .hd b{flex:1}.sheet .hd button{background:none;border:0;color:var(--mut);font-size:22px}
.sheet .bd{overflow-y:auto;padding:14px 16px}
.btn{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:600;width:100%}
.btn.ghost{background:var(--panel);color:var(--tx);border:1px solid var(--line);font-weight:400;margin-top:8px}
label{display:block;font-size:13px;color:var(--mut);margin:14px 0 6px}
input.f{width:100%;background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;outline:none}
.empty{text-align:center;color:var(--mut);padding:40px 20px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:9px 16px;border-radius:999px;font-size:13px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
#login{position:fixed;inset:0;background:var(--bg);z-index:40;display:none;flex-direction:column;justify-content:center;padding:28px}
#login.on{display:flex}
#login input.f{margin-bottom:10px}
#login label.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);margin:2px 0 0}
#login details{margin-top:22px;text-align:center;color:var(--mut);font-size:13px}
#login details summary{cursor:pointer;padding:6px}
#login details input.f{margin-top:10px}
#login img{width:84px;height:84px;margin:0 auto 14px;display:block}
#login h2{text-align:center;margin:0 0 4px}#login p{text-align:center;color:var(--mut);margin:0 0 18px;font-size:14px}
.err{color:var(--bad);font-size:13px;margin-top:10px;min-height:18px;text-align:center}
.banner{background:#78350f;color:#fde68a;font-size:12.5px;padding:8px 16px;display:none}
.banner.on{display:block}
</style>
</head>
<body>
<div id="app">
  <header><span class="dot" id="dot"></span><h1 id="title">{{AGENT_NAME}}</h1><button id="bell" aria-label="Notificaciones">🔔<span class="bbadge" id="bbadge" hidden></span></button><button id="refresh" aria-label="Actualizar">⟳</button></header>
  <div class="banner" id="banner">Sin conexión con {{AGENT_NAME}}. Reintentando…</div>
  <main>
    <section class="view on" id="v-chat">
      <div class="scroll" id="log"></div>
      <div class="chips" id="chips"></div>
      <div class="composer">
        <button class="rb mic" id="mic" aria-label="Dictar">🎙</button>
        <textarea id="inp" rows="1" placeholder="Habla con {{AGENT_NAME}}…" enterkeyhint="send"></textarea>
        <button class="rb" id="send" aria-label="Enviar">➤</button>
      </div>
    </section>
    <section class="view" id="v-hoy"><div class="scroll" id="hoy"></div></section>
    <section class="view" id="v-ent"><div class="scroll" id="ent"></div></section>
    <section class="view" id="v-cfg"><div class="scroll" id="cfg"></div></section>
  </main>
  <nav>
    <button data-v="chat" class="on"><span class="i">💬</span>{{AGENT_NAME}}</button>
    <button data-v="hoy"><span class="i">✅</span>Hoy<span class="badge" id="b-hoy" hidden></span></button>
    <button data-v="ent"><span class="i">📦</span>Entregables</button>
    <button data-v="cfg"><span class="i">⚙️</span>Ajustes</button>
  </nav>
</div>

<div class="sheet" id="sheet"><div class="in"><div class="hd"><b id="sh-t"></b><button id="sh-x">✕</button></div><div class="bd" id="sh-b"></div></div></div>
<div class="toast" id="toast"></div>

<div id="login">
  <img src="/app/icon.svg" alt="">
  <h2>{{AGENT_NAME}}</h2><p>Entra con tu usuario y contraseña.</p>
  <form id="lform" method="post" action="#" autocomplete="on">
    <input class="f" id="lu" name="username" type="text" placeholder="Usuario" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="next">
    <input class="f" id="lp" name="password" type="password" placeholder="Contraseña" autocomplete="current-password" enterkeyhint="go">
    <label class="chk"><input type="checkbox" id="lshow"> Mostrar contraseña</label>
    <div class="err" id="lerr"></div>
    <button class="btn" id="lgo" type="submit" style="margin-top:12px">Entrar</button>
  </form>
  <details id="ladv"><summary>Entrar con token (avanzado)</summary>
    <input class="f" id="tok" type="password" placeholder="Token de administrador" autocomplete="off" autocapitalize="off" autocorrect="off">
    <button class="btn ghost" id="ltok" type="button">Entrar con token</button>
  </details>
</div>

<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
          set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let TOKEN=LS.get('token','');
let chat=LS.get('chat',[]);          // [{r:'u'|'a', t:'texto', ts, model}]
let busy=false;

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)}

/* ---------- markdown liviano y seguro (todo se escapa primero) ---------- */
function md(src){
  const blocks=[];let s=esc(src).replace(/```(?:\w+)?\n?([\s\S]*?)```/g,(_,c)=>{blocks.push(c);return '\u0000'+(blocks.length-1)+'\u0000'});
  const inl=t=>t.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>')
    .replace(/(^|[\s(>])\*([^*\n]+)\*(?=[\s).,;:!?<]|$)/g,'$1<i>$2</i>').replace(/(^|[\s(>])_([^_\n]+)_(?=[\s).,;:!?<]|$)/g,'$1<i>$2</i>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  const L=s.split('\n');let out='',i=0;
  while(i<L.length){
    const l=L[i];
    if(/^\s*$/.test(l)){i++;continue}
    if(/^\u0000\d+\u0000$/.test(l.trim())){out+='<pre><code>'+blocks[+l.trim().slice(1,-1)]+'</code></pre>';i++;continue}
    let m;
    if((m=l.match(/^#{1,4}\s+(.*)/))){out+='<h3>'+inl(m[1])+'</h3>';i++;continue}
    if(/^\s*\|.*\|\s*$/.test(l)&&i+1<L.length&&/^\s*\|[\s:|-]+\|\s*$/.test(L[i+1])){
      const row=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      let h='<table><tr>'+row(l).map(c=>'<th>'+inl(c)+'</th>').join('')+'</tr>';i+=2;
      while(i<L.length&&/^\s*\|.*\|\s*$/.test(L[i])){h+='<tr>'+row(L[i]).map(c=>'<td>'+inl(c)+'</td>').join('')+'</tr>';i++}
      out+=h+'</table>';continue}
    if(/^\s*[-*•]\s+/.test(l)){let h='<ul>';while(i<L.length&&/^\s*[-*•]\s+/.test(L[i])){h+='<li>'+inl(L[i].replace(/^\s*[-*•]\s+/,''))+'</li>';i++}out+=h+'</ul>';continue}
    if(/^\s*\d+[.)]\s+/.test(l)){let h='<ol>';while(i<L.length&&/^\s*\d+[.)]\s+/.test(L[i])){h+='<li>'+inl(L[i].replace(/^\s*\d+[.)]\s+/,''))+'</li>';i++}out+=h+'</ol>';continue}
    let p=[];while(i<L.length&&!/^\s*$/.test(L[i])&&!/^(#{1,4}\s|\s*[-*•]\s|\s*\d+[.)]\s|\s*\|)/.test(L[i])&&!/^\u0000\d+\u0000$/.test(L[i].trim())){p.push(L[i]);i++}
    if(p.length)out+='<p>'+inl(p.join('<br>'))+'</p>';else i++;
  }
  return out;
}

/* ---------- red ---------- */
async function api(path,opt={}){
  const r=await fetch(path,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{}),Authorization:'Bearer '+TOKEN}});
  if(r.status===401){logout(true);throw new Error('Sesión vencida')}
  if(!r.ok){let m='';try{m=(await r.json()).error}catch(e){}throw new Error(m||('Error '+r.status))}
  return r.json();
}
function online(ok){$('#dot').classList.toggle('on',ok);$('#banner').classList.toggle('on',!ok)}

/* ---------- login ---------- */
function showLogin(msg){
  $('#login').classList.add('on');$('#lerr').textContent=msg||'';
  const u=LS.get('user','');if(u&&!$('#lu').value)$('#lu').value=u;
  setTimeout(()=>{try{($('#lu').value?$('#lp'):$('#lu')).focus()}catch(e){}},60)}
async function logout(expired){
  const t=TOKEN;TOKEN='';LS.del('token');
  if(!expired&&t){try{await fetch('/v1/app/logout',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},body:'{}'})}catch(e){}}  // invalida la sesión EN EL SERVIDOR
  showLogin(expired?'Tu sesión venció. Entra de nuevo.':'')}
// usuario y contraseña → el servidor entrega una sesión propia (revocable); el token maestro ya no se teclea en el teléfono
$('#lform').addEventListener('submit',async e=>{
  e.preventDefault();
  const user=$('#lu').value.trim(),pass=$('#lp').value;if(!user||!pass)return;
  const btn=$('#lgo');btn.disabled=true;$('#lerr').textContent='Entrando…';
  try{
    const r=await fetch('/v1/app/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user,password:pass})});
    let d={};try{d=await r.json()}catch(_){}
    if(r.ok&&d.token){TOKEN=d.token;LS.set('token',d.token);LS.set('user',d.user||user);$('#lp').value='';$('#login').classList.remove('on');boot();btn.disabled=false;return}
    if(r.status===429){const m=Math.max(1,Math.ceil((d.retry_after||60)/60));$('#lerr').textContent='Demasiados intentos. Espera '+m+' min y vuelve a intentar.'}
    else if(r.status===401){$('#lerr').textContent=d.error||'Usuario o contraseña incorrectos.';$('#lp').value='';$('#lp').focus()}
    else $('#lerr').textContent='No pude entrar (error '+r.status+').';
  }catch(err){$('#lerr').textContent='No pude conectar con {{AGENT_NAME}}.'}
  btn.disabled=false;
});
$('#lshow').onchange=()=>{$('#lp').type=$('#lshow').checked?'text':'password'};
// opción avanzada: token de administrador (como antes)
$('#ltok').onclick=async()=>{
  const t=$('#tok').value.trim();if(!t)return;
  $('#lerr').textContent='Verificando…';
  try{
    const r=await fetch('/v1/app/ping',{headers:{Authorization:'Bearer '+t}});
    if(r.status===401){$('#lerr').textContent='Token incorrecto.';return}
    if(!r.ok)throw 0;
    TOKEN=t;LS.set('token',t);LS.set('user','');$('#tok').value='';$('#login').classList.remove('on');boot();
  }catch(e){$('#lerr').textContent='No pude conectar con {{AGENT_NAME}}.'}
};
$('#tok').addEventListener('keydown',e=>{if(e.key==='Enter')$('#ltok').click()});

/* ---------- navegación ---------- */
const titles={chat:'{{AGENT_NAME}}',hoy:'Hoy',ent:'Entregables',cfg:'Ajustes'};
function go(v){
  $$('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+v));
  $$('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  $('#title').textContent=titles[v];LS.set('tab',v);
  if(v==='hoy')loadHoy();if(v==='ent')loadEnt();if(v==='cfg')renderCfg();
  if(v==='chat')scrollDown();
}
$$('nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
$('#refresh').onclick=()=>{const v=LS.get('tab','chat');if(v==='hoy')loadHoy();else if(v==='ent')loadEnt();else ping();toast('Actualizado')};

/* ---------- chat ---------- */
const CHIPS=['¿Qué tengo hoy?','Resumen de mis pendientes','¿Qué entregables esperan mi Vo.Bo.?','¿Qué vence esta semana?','Prepárame el cierre del día'];
function renderChips(){$('#chips').innerHTML=CHIPS.map(c=>`<button class="chip">${esc(c)}</button>`).join('');
  $$('#chips .chip').forEach(b=>b.onclick=()=>sendMsg(b.textContent))}
function fmtTime(ts){try{return new Date(ts).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})}catch(e){return ''}}
function bubble(m,i){
  const d=document.createElement('div');d.className='msg '+m.r;
  if(m.r==='u'){d.textContent=m.t}
  else{d.innerHTML=md(m.t)+`<div class="meta"><span>${fmtTime(m.ts)}${m.model?' · '+esc(m.model):''}</span><button data-c="${i}">Copiar</button></div>`;
    d.querySelector('[data-c]').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(m.t).then(()=>toast('Copiado'))}}
  return d;
}
function renderChat(){
  const log=$('#log');log.innerHTML='';
  if(!chat.length){log.innerHTML='<div class="empty"><div style="font-size:42px">🧠</div><b>Listo, Polo.</b><br>Pregúntame lo que sea de tu agenda, entregables o clientes.</div>'}
  chat.forEach((m,i)=>log.appendChild(bubble(m,i)));scrollDown();
}
function scrollDown(){const l=$('#log');requestAnimationFrame(()=>l.scrollTop=l.scrollHeight)}
let ctl=null;
const rid=()=>(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(36).slice(2)).replace(/[^A-Za-z0-9_-]/g,'');
function setBusy(b){busy=b;const s=$('#send');s.classList.toggle('stop',b);s.textContent=b?'■':'➤';s.setAttribute('aria-label',b?'Detener':'Enviar')}
function finishMsg(t,model){chat.push({r:'a',t,ts:Date.now(),model});LS.set('chat',chat.slice(-200));LS.del('pending')}
async function sendMsg(text){
  text=(text||'').trim();if(!text||busy)return;
  setBusy(true);$('#inp').value='';autosize();
  chat.push({r:'u',t:text,ts:Date.now()});LS.set('chat',chat.slice(-200));renderChat();
  const id=rid();LS.set('pending',{id,ts:Date.now()});
  const log=$('#log'),d=document.createElement('div');d.className='msg a live';
  d.innerHTML='<span class="typing"><i></i><i></i><i></i></span><div class="st"></div>';log.appendChild(d);scrollDown();
  const hist=chat.slice(0,-1).slice(-16).map(m=>({role:m.r==='u'?'user':'assistant',content:m.t}));
  let acc='',model='',gotDone=false,failed='',raf=0;
  const paint=()=>{raf=0;d.classList.add('has');d.innerHTML=md(acc);scrollDown()};
  ctl=new AbortController();
  try{
    const r=await fetch('/v1/app/chat/stream',{method:'POST',signal:ctl.signal,
      headers:{'Content-Type':'application/json',Authorization:'Bearer '+TOKEN},
      body:JSON.stringify({rid:id,messages:[...hist,{role:'user',content:text}]})});
    if(r.status===401){logout(true);throw new Error('Sesión vencida')}
    if(!r.ok){let m='';try{m=(await r.json()).error}catch(e){}throw new Error(m||('Error '+r.status))}
    online(true);
    const onEv=(ev,data)=>{
      if(ev==='status'){const st=d.querySelector('.st');if(st&&!acc)st.textContent='Pensando… '+data.s+' s'}
      else if(ev==='delta'){acc+=data.d;if(!raf)raf=requestAnimationFrame(paint)}
      else if(ev==='done'){gotDone=true;model=data.model}
      else if(ev==='fail'){failed=data.error}
    };
    if(!r.body){const t=await r.text();parseSSE(t,onEv)}
    else{const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
      for(;;){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});
        const k=buf.lastIndexOf('\n\n');if(k>=0){parseSSE(buf.slice(0,k+2),onEv);buf=buf.slice(k+2)}}}
    if(failed)throw new Error(failed);
    if(!gotDone&&!acc)throw new Error('conexión interrumpida');
    finishMsg(acc,model);if(navigator.vibrate)navigator.vibrate(15);
  }catch(e){
    if(e.name==='AbortError'){ if(acc)finishMsg(acc+'\n\n_(detenido)_',model); else {LS.del('pending');chat.push({r:'a',t:'_(detenido)_',ts:Date.now()})} LS.set('chat',chat.slice(-200)) }
    else if(!acc&&!failed&&LS.get('pending')){ // se cortó la conexión: la respuesta puede seguir en el servidor
      online(false);setBusy(false);ctl=null;renderChat();recoverPending(true);return}
    else{chat.push({r:'a',t:acc?acc+'\n\n⚠️ '+e.message:'⚠️ '+e.message+'. Vuelve a enviar.',ts:Date.now()});LS.del('pending');LS.set('chat',chat.slice(-200));online(false)}
  }
  ctl=null;setBusy(false);renderChat();
}
function parseSSE(txt,cb){for(const blk of txt.split('\n\n')){if(!blk.trim())continue;let ev='message',data='';
  for(const l of blk.split('\n')){if(l.startsWith('event:'))ev=l.slice(6).trim();else if(l.startsWith('data:'))data+=l.slice(5).trim()}
  try{cb(ev,JSON.parse(data||'{}'))}catch(e){}}}
/* Si el teléfono se bloqueó a media respuesta, el servidor la guardó: la recuperamos al volver. */
let recovering=false;
async function recoverPending(show){
  const p=LS.get('pending');if(!p||recovering||busy||!TOKEN)return;
  if(Date.now()-p.ts>3600e3){LS.del('pending');return}
  recovering=true;
  if(show){const l=$('#log'),d=document.createElement('div');d.className='msg a';d.id='rec';d.innerHTML='<span class="typing"><i></i><i></i><i></i></span><div class="st">Recuperando la respuesta…</div>';l.appendChild(d);scrollDown()}
  try{
    for(let n=0;n<90;n++){
      const r=await api('/v1/app/chat/result?rid='+encodeURIComponent(p.id));online(true);
      if(!r.found){LS.del('pending');break}
      if(r.done){finishMsg(r.error?'⚠️ '+r.error:r.text,r.model);break}
      await new Promise(ok=>setTimeout(ok,2000));if(document.hidden)break;
    }
  }catch(e){}
  recovering=false;renderChat();
}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;
$('#mic').onclick=()=>{

  if(rec){rec.stop();return}

  rec.onend=()=>{rec=null;$('#mic').classList.remove('rec')};rec.onerror=()=>{rec=null;$('#mic').classList.remove('rec')};
  rec.start();
};

const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const pushOK=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
const u8=b=>{const p='='.repeat((4-b.length%4)%4),s=(b+p).replace(/-/g,'+').replace(/_/g,'/'),r=atob(s);return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))};
async function pushSub(){const reg=await navigator.serviceWorker.ready;return reg.pushManager.getSubscription()}
async function pushEnable(){
  const perm=await Notification.requestPermission();
  if(perm!=='granted')throw new Error('Permiso denegado. Actívalo en Ajustes del teléfono → {{AGENT_NAME}} → Notificaciones.');
  const reg=await navigator.serviceWorker.ready;
  let sub=await reg.pushManager.getSubscription();
  if(!sub){const {key}=await api('/v1/app/push/key');sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(key)})}
  await api('/v1/app/push/subscribe',{method:'POST',body:JSON.stringify({subscription:sub.toJSON(),label:(isIOS?'iPhone':/Android/.test(navigator.userAgent)?'Android':'Navegador')})});
}
async function renderPush(){
  const c=$('#pushcard');if(!c)return;
  if(isIOS&&!standalone){c.innerHTML='<div class="sub">En iPhone primero instala la app: Safari → Compartir → <b>Agregar a pantalla de inicio</b>, ábrela desde el ícono y regresa aquí.</div>';return}
  if(!pushOK()){c.innerHTML='<div class="sub">Este navegador no soporta notificaciones push.</div>';return}
  if(Notification.permission==='denied'){c.innerHTML='<div class="sub">Bloqueadas. Actívalas en los Ajustes del teléfono → {{AGENT_NAME}} → Notificaciones.</div>';return}
  const sub=await pushSub().catch(()=>null);
  if(sub&&Notification.permission==='granted'){
    c.innerHTML='<div class="row"><span>🔔 Activadas</span><span class="sub">en este teléfono</span></div><button class="btn ghost" id="ptest">Enviar notificación de prueba</button><button class="btn ghost" id="poff" style="color:var(--bad)">Desactivar</button>';
    $('#ptest').onclick=async()=>{try{const r=await api('/v1/app/push/test',{method:'POST',body:'{}'});toast(r.ok?'Enviada — debe llegar en segundos':'El servicio de push no la aceptó')}catch(e){toast('⚠️ '+e.message)}};
    $('#poff').onclick=async()=>{try{const e=sub.endpoint;await sub.unsubscribe();await api('/v1/app/push/unsubscribe',{method:'POST',body:JSON.stringify({endpoint:e})});toast('Desactivadas')}catch(e){toast('⚠️ '+e.message)}renderPush()};
  }else{
    c.innerHTML='<div class="sub" style="margin-bottom:10px">Recibe en el teléfono tus recordatorios, el seguimiento del día y las respuestas largas de {{AGENT_NAME}} aunque tengas la app cerrada.</div><button class="btn" id="pon">Activar notificaciones</button>';
    $('#pon').onclick=async()=>{try{await pushEnable();toast('Activadas ✓')}catch(e){toast('⚠️ '+e.message)}renderPush()};
  }
}
// Si ya estaban concedidas, re-registra en silencio (por si el navegador rotó la suscripción).
async function pushResync(){if(pushOK()&&Notification.permission==='granted'&&(!isIOS||standalone)){try{await pushEnable()}catch(e){}}}
navigator.serviceWorker&&navigator.serviceWorker.addEventListener('message',e=>{
  const m=e.data||{};
  if(m.type==='tab'){if(m.tab==='notifs')openInbox(m.nid);else{go(m.tab);if(m.tab==='chat')recoverPending(true)}}
  else if(m.type==='push'){refreshBell();if(LS.get('tab')==='hoy')loadHoy()}});

/* ---------- arranque ---------- */
function boot(){renderChips();renderChat();ping();
  const qs=new URLSearchParams(location.search),q=qs.get('tab');go(titles[q]?q:LS.get('tab','chat'));
  refreshBell();if(q==='notifs')openInbox(qs.get('nid')||'');
  loadHoy().catch(()=>{});recoverPending(true);pushResync()}
if('serviceWorker' in navigator)navigator.serviceWorker.register('/app/sw.js').catch(()=>{});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&TOKEN){ping();refreshBell();recoverPending(true);if(LS.get('tab')==='hoy')loadHoy()}});
if(TOKEN){boot()}else{showLogin('')}
</script>
